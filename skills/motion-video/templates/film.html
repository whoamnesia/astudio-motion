<!doctype html>
<!--
astudio-motion film template - HTML + GSAP on ONE paused master timeline, rendered frame by frame.
Structure: scenes are absolutely positioned layers inside #stage (fixed W x H); each scene has a builder that returns
a nested timeline; seams use cut-the-curve helpers (mirrored power4.in / power4.out, same axis and direction, the cut
lands mid-motion, no overlap); the film's current flows LEFT.
Render:  node <root>/scripts/motion.cjs video film.html --duration 12.5 --fps 30 --width 1920 --height 1080 --out renders/film.mp4
Strip:   node <root>/scripts/motion.cjs strip film.html --at 0.6,3.0,3.3,5.2,6.4,8.0,8.3,10.6,12.4 --width 1920 --height 1080
Preview: open film.html?play in a browser.  Replace the brand layer (:root), copy and the product UI; keep the contract.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<title>Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ground:#F2F1EC; --ink:#14161C; --muted:#6B6F7A; --accent:#E0592A; --panel:#FFFFFF; --line:#E1E2E6;
          --W:1920px; --H:1080px; --display:'Onest', system-ui, sans-serif; }
  html, body { margin:0; background:#000; overflow:hidden; }
  #stage { position:relative; width:var(--W); height:var(--H); overflow:hidden; background:var(--ground); font-family:var(--display); color:var(--ink); }
  .scene { position:absolute; inset:0; visibility:hidden; }
  /* S1 hook */
  .hook { position:absolute; left:160px; top:330px; font-weight:800; font-size:150px; line-height:1.0; letter-spacing:-0.035em; }
  .hook .w { display:inline-block; margin-right:0.22em; }
  .hook .accent { color:var(--accent); }
  /* S2 product */
  .cam { position:absolute; inset:0; transform-origin:0 0; }
  .win { position:absolute; left:310px; top:150px; width:1300px; height:780px; background:var(--panel); border-radius:28px;
         box-shadow:0 40px 80px -30px rgba(20,22,28,.25), 0 0 0 1px var(--line); overflow:hidden; }
  .win .bar { height:64px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 24px; }
  .win .bar i { width:14px; height:14px; border-radius:50%; background:#E3E4E8; }
  .win h3 { position:absolute; left:48px; top:104px; margin:0; font-size:44px; font-weight:800; letter-spacing:-0.02em; }
  .rows { position:absolute; left:48px; right:48px; top:190px; display:grid; gap:14px; }
  .row { height:78px; border-radius:16px; background:#F6F6F3; display:flex; align-items:center; padding:0 24px; font-size:30px; font-weight:600; gap:18px; }
  .row b { width:12px; height:12px; border-radius:50%; background:var(--accent); }
  .row span { margin-left:auto; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums; }
  .btn { position:absolute; right:48px; top:96px; height:64px; padding:0 30px; border-radius:16px; background:var(--ink); color:#fff;
         display:flex; align-items:center; font-size:26px; font-weight:600; transform-origin:100% 0; }
  .cursor { position:absolute; left:0; top:0; width:84px; height:84px; z-index:5; }
  /* S3 claim (colour flood) */
  .flood { position:absolute; inset:0; background:var(--accent); }
  .claim { position:absolute; left:160px; top:400px; font-weight:800; font-size:132px; letter-spacing:-0.035em; color:var(--ground); line-height:1.02; }
  /* S4 end card */
  .end { position:absolute; inset:0; background:var(--ink); }
  .lockup { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:34px; color:var(--ground); }
  .mark { width:150px; height:150px; position:relative; }
  .mark .v { position:absolute; left:0; top:0; width:38px; height:150px; background:var(--ground); border-radius:4px; }
  .mark .h { position:absolute; left:0; bottom:0; width:150px; height:38px; background:var(--ground); border-radius:4px; }
  .mark .o { position:absolute; left:66px; top:18px; width:66px; height:66px; border-radius:50%; background:var(--accent); }
  .word { font-weight:800; font-size:128px; letter-spacing:-0.04em; overflow:hidden; }
  .cta { position:absolute; left:0; right:0; top:66%; text-align:center; color:var(--ground); opacity:.8; font-size:40px; font-weight:600; }
</style></head>
<body>
<div id="stage">
  <section class="scene" id="s1">
    <div class="hook"><span class="w">Motion</span><span class="w">that</span><br><span class="w">feels</span><span class="w accent">right.</span></div>
  </section>

  <section class="scene" id="s2">
    <div class="cam" id="cam">
      <div class="win" id="win">
        <div class="bar"><i></i><i></i><i></i></div>
        <h3>Releases</h3>
        <div class="btn" id="btn">New release</div>
        <div class="rows" id="rows">
          <div class="row"><b></b>Onboarding v3<span>2m ago</span></div>
          <div class="row"><b></b>Checkout motion<span>1h ago</span></div>
          <div class="row"><b></b>Search sheet<span>3h ago</span></div>
          <div class="row"><b></b>Pricing page<span>1d ago</span></div>
        </div>
      </div>
    </div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.6 1.6L9.6 19z" fill="#14161C" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </section>

  <section class="scene" id="s3">
    <div class="flood" id="flood"></div>
    <div class="claim" id="claim">Every curve<br>from one system.</div>
  </section>

  <section class="scene" id="s4">
    <div class="end"></div>
    <div class="lockup"><div class="mark" id="mark"><i class="v"></i><i class="h"></i><i class="o"></i></div><div class="word" id="word">astudio</div></div>
    <div class="cta" id="cta">astudio.one</div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
const W = 1920, H = 1080;
const master = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
const show = (sel, at) => master.set(sel, { visibility: 'visible' }, at);
const hide = (sel, at) => master.set(sel, { visibility: 'hidden' }, at);
// Cut-the-curve seam: the exit accelerates LEFT and is cut mid-flight; the entry starts mid-flight from the RIGHT.
const SEAM = { d: 0.42, dist: 520 };
// Camera helper: scale the camera layer so element `sel` lands at the frame centre; returns the target point on screen.
function focusOn(sel, scale) {
  const r = document.querySelector(sel).getBoundingClientRect(), st = document.getElementById('stage').getBoundingClientRect();
  const cx = r.left - st.left + r.width / 2, cy = r.top - st.top + r.height / 2;
  return { scale, x: W / 2 - cx * scale, y: H / 2 - cy * scale, px: W / 2, py: H / 2 };
}
function exitLeft(tl, sel, at) { tl.to(sel, { x: -SEAM.dist, filter: 'blur(14px)', duration: SEAM.d, ease: 'power4.in' }, at); }
function enterRight(tl, sel, at) { tl.fromTo(sel, { x: SEAM.dist, filter: 'blur(14px)' }, { x: 0, filter: 'blur(0px)', duration: SEAM.d + 0.18, ease: 'power4.out' }, at); }

// ---- S1 hook 0 -> 3.2 : words land from blur (no translate), hold, exit left
show('#s1', 0);
master.from('#s1 .w', { opacity: 0, filter: 'blur(10px)', duration: 0.5, stagger: 0.11, ease: 'power2.out' }, 0);
exitLeft(master, '#s1 .hook', 2.78);
hide('#s1', 3.2);

const FOCUS = focusOn('#btn', 1.7);
// ---- S2 product 3.2 -> 8.0 : window enters mid-flight, camera pushes to the button, cursor clicks, button morphs, rows populate
show('#s2', 3.2);
enterRight(master, '#win', 3.2);
master.from('#rows .row', { opacity: 0, y: 14, duration: 0.45, stagger: 0.06, ease: 'expo.out' }, 3.55)
      .fromTo('#cursor', { x: 1700, y: 1150 }, { x: 1530, y: 260, duration: 0.9, ease: 'power2.inOut' }, 4.0)
      // camera push (Auto Zoom): the button lands at frame centre at 1.7x; the cursor arrives with the camera
      .to('#cam', { scale: FOCUS.scale, x: FOCUS.x, y: FOCUS.y, duration: 0.6, ease: 'expo.out' }, 4.55)
      .to('#cursor', { x: FOCUS.px + 44, y: FOCUS.py + 6, duration: 0.6, ease: 'expo.out' }, 4.55)
      // click: press squash and release on the same frame the button reacts
      .to('#cursor', { scale: 0.86, duration: 0.08, ease: 'power2.out' }, 5.3)
      .to('#btn', { scale: 0.96, duration: 0.08, ease: 'power2.out' }, 5.3)
      .to('#cursor', { scale: 1, duration: 0.22, ease: 'back.out(1.6)' }, 5.38)
      // morph: the button becomes the new row at the top of the list (container morph, content swaps with blur)
      .to('#btn', { scale: 1, backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--accent'), duration: 0.3, ease: 'power3.out' }, 5.38)
      .to('#cam', { scale: 1, x: 0, y: 0, duration: 0.7, ease: 'expo.inOut' }, 5.9)
      .to('#cursor', { x: 1650, y: 1150, duration: 0.6, ease: 'power3.in' }, 6.0)
      .add(() => {}, 6.6);
// a new row arrives at the top while the others make room (sequenced UI life)
const newRow = document.createElement('div'); newRow.className = 'row'; newRow.innerHTML = '<b></b>Motion system v1<span>now</span>';
document.getElementById('rows').prepend(newRow);
master.from(newRow, { opacity: 0, y: -20, filter: 'blur(6px)', duration: 0.55, ease: 'expo.out' }, 6.55)
      .from('#rows .row:not(:first-child)', { y: -88, duration: 0.55, ease: 'expo.out' }, 6.55);
exitLeft(master, '#win', 7.58);
hide('#s2', 8.0);

// ---- S3 claim 8.0 -> 10.5 : colour flood from the right edge (continuing the current), claim lands, holds
show('#s3', 8.0);
master.fromTo('#flood', { clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0%)', duration: 0.5, ease: 'power3.out' }, 8.0);
enterRight(master, '#claim', 8.05);
hide('#s3', 10.5);

// ---- S4 end card 10.5 -> 12.5 : mark builds from its parts, wordmark unfolds, CTA, hold >= 1.5s
show('#s4', 10.5);
master.from('#mark .v', { y: -200, opacity: 0, duration: 0.6 }, 10.5)
      .from('#mark .h', { x: -200, opacity: 0, duration: 0.6 }, 10.58)
      .from('#mark .o', { scale: 0.5, opacity: 0, duration: 0.55 }, 10.7)
      .from('#word', { clipPath: 'inset(0 100% 0 0)', x: -40, duration: 0.6, ease: 'expo.out' }, 10.95)
      .from('#cta', { opacity: 0, y: 12, duration: 0.45, ease: 'power3.out' }, 11.2)
      .to({}, { duration: 0.01 }, 12.5);

// Frame 0 is composed (thumbnail / autoplay preview): the render starts OPEN seconds in, the first word already landing.
const OPEN = 0.3;
window.__duration = master.duration() - OPEN;
window.__seek = (t) => { master.pause(); master.seek(Math.min(OPEN + t, master.duration()), false); };
document.fonts.ready.then(() => { window.__seek(0); if (new URLSearchParams(location.search).has('play')) master.play(OPEN); });
window.__seek(0);
</script>
</body></html>
